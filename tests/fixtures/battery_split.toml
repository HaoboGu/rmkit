# Minimal regression for RMK's use_config/nrf52840_ble_split example (issue #19).
[keyboard]
name = "Battery Split"
vendor_id = 0x4c4b
product_id = 0x4643
chip = "nrf52840"

[layout]
rows = 1
cols = 2
map = "(0,0) (0,1)"

[keymap]
layers = 1

[[keymap.layer]]
keys = "A B"

[ble]
enabled = true

[split]
connection = "ble"

[split.central]
rows = 1
cols = 1
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]
matrix = { row_pins = ["P0_12"], col_pins = ["P0_14"] }

[split.central.battery]
battery_adc_pin = "P0_05"
adc_divider_measured = 2000
adc_divider_total = 2806

[[split.peripheral]]
rows = 1
cols = 1
row_offset = 0
col_offset = 1
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]
matrix = { row_pins = ["P1_11"], col_pins = ["P0_30"] }

[split.peripheral.battery]
battery_adc_pin = "P0_05"
adc_divider_measured = 2000
adc_divider_total = 2806
